[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awox-mesh"
version = "1.1.0"
description = "Control AwoX/EGLO BLE mesh lamps without the cloud, with a documented HTTP bridge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "awox-mesh contributors" }]
keywords = ["awox", "eglo", "bluetooth", "ble", "mesh", "smart-home", "light"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "bleak>=0.21",
    "pycryptodome>=3.19",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    "pexpect>=4.9",
    "dbus-fast>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/Paluss1122-1/awox-mesh"
Issues = "https://github.com/Paluss1122-1/awox-mesh/issues"

[project.scripts]
awox = "awox_mesh.cli:main"
awox-mesh = "awox_mesh.cli:main"
awox-mesh-bridge = "awox_mesh.bridge.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/awox_mesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]